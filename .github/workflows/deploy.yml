name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck & run tests
        run: deno task check && deno task test

      - name: Push InstantDB permissions
        run: npx instant-cli@latest push perms --app "$INSTANT_APP_ID" --token "$INSTANT_CLI_AUTH_TOKEN" --yes
        env:
          INSTANT_APP_ID: ${{ secrets.INSTANT_APP_ID }}
          INSTANT_CLI_AUTH_TOKEN: ${{ secrets.INSTANT_CLI_AUTH_TOKEN }}

      - name: Build frontend
        run: deno task build:web
        env:
          VITE_API_BASE_URL: ""
          VITE_INSTANT_APP_ID: ${{ secrets.VITE_INSTANT_APP_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
