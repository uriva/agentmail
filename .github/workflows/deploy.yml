name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build frontend
        run: deno task build:web
        env:
          VITE_INSTANT_APP_ID: ${{ vars.VITE_INSTANT_APP_ID }}

      - name: Deploy to Deno Deploy
        run: deno deploy --prod
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
